<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>

    <style>
        body{
            font-family: sans-serif;
        }

        .formulario{
            background: rgb(234, 234, 243);
            width: 300px;
            height: 470px;
            border: 2px solid black;
        }

        input {
            background-color: transparent;
            color: rgb(0, 0, 0);
            padding: 5px;
            margin: 5px;
            border: none;
            border: 2px solid rgba(41, 23, 23, 0.467);
        }

        textarea{
            background-color: transparent;
            border: 2px solid #0007;
        }

        .cont-boton{
            text-align: center;
        }

        .boton {
            background-color: #0004 ;
        }
    </style>
</head>

<body>
    <form name="datos">
        <div class="formulario">
            <input type="number"> Number<br>
            <input type="email" placeholder="example@gmail.com">Email <br>
            <input type="text" placeholder="jesus"> Nombre <br>
            <input type="text" placeholder="Velez"> Apellido <br>
            <input type="date"> Fecha nacimiento <br>
            <input type="url" placeholder="www.example.com"> Pagina web <br>
            <label>Que estandares conoces?</label> <br>
            <input type="checkbox" value="HTML5" checked> HTML5 <br>
            <input type="checkbox" value="CSS3" >CCS3 <br>
            <input type="checkbox" value="JavaScript" >JavaScript <br>
            <textarea cols="15" rows="6"></textarea>
            <br>
            <div class="cont-boton">
                <input class="boton" type="button" value="Send the info!" style="text-align: center;">
            </div>
        </div>
    </form>
</body>
</html>
